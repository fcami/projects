# GitHub Actions CI — detect changed subprojects, fan out to parallel jobs.
#
# Logic lives in infrastructure/ci/ scripts, not here. This file is a thin adapter
# (Martin: Dependency Inversion — CI config depends on the contract,
# not on language-specific tooling).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: run all subprojects regardless of changes (catches dependency rot)
    - cron: '0 6 * * 1'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      infrastructure: ${{ steps.detect.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Weekly: run all subprojects, and the infrastructure
            INFRA=true
            MATRIX=$(ls -d projects/*/Makefile 2>/dev/null | xargs -I{} dirname {} | xargs -I{} basename {} | jq -R -s -c 'split("\n") | map(select(. != ""))')
          else
            INFRA=$(infrastructure/ci/detect-changes.sh --infrastructure)
            MATRIX=$(infrastructure/ci/detect-changes.sh)
          fi
          echo "infrastructure=${INFRA}" >> "$GITHUB_OUTPUT"
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "Infrastructure changed: ${INFRA}"
          echo "Affected subprojects: ${MATRIX}"

  # The monorepo tooling runs its own contract (infrastructure/Makefile)
  # before any subproject, since every subproject depends on it.
  infrastructure:
    needs: detect
    if: needs.detect.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup toolchain
        run: infrastructure/ci/setup-toolchain.sh infrastructure
      - name: Lint, build, test
        run: infrastructure/ci/run-project-ci.sh infrastructure

  build:
    needs: [detect, infrastructure]
    # Run when infrastructure passed or was skipped (not when it failed)
    if: >-
      ${{ !cancelled()
      && needs.detect.result == 'success'
      && needs.infrastructure.result != 'failure'
      && needs.detect.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup toolchain
        run: infrastructure/ci/setup-toolchain.sh ${{ matrix.project }}
      - name: Lint
        run: make -C projects/${{ matrix.project }} lint
      - name: Build
        run: make -C projects/${{ matrix.project }} build
      - name: Test
        run: make -C projects/${{ matrix.project }} test
