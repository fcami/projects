# GitHub Actions release — on a v* tag, publish the clean monorepo tarball.
#
# The tarball (infrastructure/ci/make-release.sh) is the monorepo without
# any subproject, ready to start a new one. Subproject tags
# (projects/<name>/v*) don't match v* and don't trigger this workflow.
# Logic lives in infrastructure/ci/ scripts; this file is a thin adapter.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup toolchain
        run: infrastructure/ci/setup-toolchain.sh infrastructure
      - name: Lint, build, test
        run: infrastructure/ci/run-project-ci.sh infrastructure
      - name: Build release tarball
        run: make -C infrastructure release VERSION="${GITHUB_REF_NAME}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "dist/projects-${GITHUB_REF_NAME}.tar.gz"
          --title "${GITHUB_REF_NAME}" --generate-notes
